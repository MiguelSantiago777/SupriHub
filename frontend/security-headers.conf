# Cabeçalhos de segurança do conteúdo estático (a API já envia os seus, via Spring Security).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# script-src sem 'unsafe-inline' (o build não gera scripts inline: inlineCritical desligado).
# challenges.cloudflare.com: captcha (Turnstile) das telas de entrada e cadastro.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
# Navegadores ignoram HSTS em HTTP; vale quando o site é servido por HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
