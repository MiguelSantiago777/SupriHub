server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API, documentação e health → backend (mesma origem: cookie SameSite=Strict funciona)
    location ~ ^/(api|swagger-ui|v3/api-docs|actuator/health) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # $http_host mantém a porta (ex.: 10.0.3.143:4200). Com $host a porta se perdia e o
        # backend via a própria página como outra origem: 403 "Invalid CORS request" fora do localhost.
        proxy_set_header Host $http_host;
        # Sobrescreve (não acrescenta): um X-Forwarded-For enviado pelo cliente seria aceito
        # como IP real e burlaria o rate limit e o registro de IP da assinatura eletrônica.
        # Se houver outro proxy/LB na frente, configure real_ip_header/set_real_ip_from aqui.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }

    # Arquivos com hash no nome: cache longo
    location ~* \.(?:js|css|woff2?|ttf|png|svg|ico)$ {
        expires 30d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /documentos/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # SPA: rotas do Angular caem no index.html (sem cache)
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
