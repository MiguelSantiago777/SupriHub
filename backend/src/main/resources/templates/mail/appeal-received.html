<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{mail/fragments :: head}"></head>
<body style="margin:0;background:#f4f4f4;">
<div style="max-width:600px;margin:0 auto;background:#ffffff;">
    <div th:replace="~{mail/fragments :: header}"></div>
    <div style="padding:24px;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.6;color:#1a1a1a;">
        <p>Olá, <strong th:text="${name}">Maria</strong>!</p>
        <p>Há um recurso contra inabilitação aguardando decisão.</p>
        <p>Protocolo: <strong th:text="${protocol}">CR-2026-00001</strong><br>
            Interessado: <strong th:text="${supplierName}">Fornecedor</strong><br>
            Etapa: <strong th:text="${stage}">Comissão</strong><br>
            Prazo: <strong th:text="${dueDate}">20/10/2026</strong> (Edital, item 5.2)</p>
        <p style="text-align:center;margin:28px 0;">
            <a th:replace="~{mail/fragments :: button(${link}, 'Abrir o recurso')}"></a>
        </p>
    </div>
    <div th:replace="~{mail/fragments :: footer}"></div>
</div>
</body>
</html>
