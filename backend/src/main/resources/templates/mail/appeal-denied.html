<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{mail/fragments :: head}"></head>
<body style="margin:0;background:#f4f4f4;">
<div style="max-width:600px;margin:0 auto;background:#ffffff;">
    <div th:replace="~{mail/fragments :: header}"></div>
    <div style="padding:24px;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.6;color:#1a1a1a;">
        <p>Olá, <strong th:text="${name}">Maria</strong>!</p>
        <p>A Diretoria analisou o seu recurso sobre o requerimento
            <strong th:text="${protocol}">CR-2026-00001</strong> e <strong>manteve a inabilitação</strong>,
            pelo motivo abaixo:</p>
        <div style="background:#f1f6fa;border-left:4px solid #0b4f6c;padding:12px 16px;margin:16px 0;white-space:pre-line;" th:text="${reason}">Motivação</div>
        <p>O credenciamento é permanente: você pode corrigir o que foi apontado e enviar o requerimento de novo
            pela sua área.</p>
        <p style="text-align:center;margin:28px 0;">
            <a th:replace="~{mail/fragments :: button(${link}, 'Abrir minha área')}"></a>
        </p>
    </div>
    <div th:replace="~{mail/fragments :: footer}"></div>
</div>
</body>
</html>
