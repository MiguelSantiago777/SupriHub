<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{mail/fragments :: head}"></head>
<body style="margin:0;background:#f4f4f4;">
<div style="max-width:600px;margin:0 auto;background:#ffffff;">
    <div th:replace="~{mail/fragments :: header}"></div>
    <div style="padding:24px;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.6;color:#1a1a1a;">
        <p>Olá, <strong th:text="${name}">Maria</strong>!</p>
        <p>A Comissão de Credenciamento manteve a decisão e <strong>encaminhou o seu recurso à Diretoria</strong>
            (requerimento <strong th:text="${protocol}">CR-2026-00001</strong>), com a motivação que você pode ver na
            sua área.</p>
        <p>A Diretoria decide até <strong th:text="${dueDate}">27/10/2026</strong> (5 dias úteis).</p>
        <p style="text-align:center;margin:28px 0;">
            <a th:replace="~{mail/fragments :: button(${link}, 'Acompanhar meu recurso')}"></a>
        </p>
    </div>
    <div th:replace="~{mail/fragments :: footer}"></div>
</div>
</body>
</html>
