<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{mail/fragments :: head}"></head>
<body style="margin:0;background:#f4f4f4;">
<div style="max-width:600px;margin:0 auto;background:#ffffff;">
    <div th:replace="~{mail/fragments :: header}"></div>
    <div style="padding:24px;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.6;color:#1a1a1a;">
        <p>Olá, <strong th:text="${name}">Maria</strong>!</p>
        <p>A Comissão de Credenciamento analisou o seu requerimento
            <strong th:text="${protocol}">CR-2026-00001</strong> e precisa de um ajuste:</p>
        <div style="background:#f1f6fa;border-left:4px solid #0b4f6c;padding:12px 16px;margin:16px 0;white-space:pre-line;" th:text="${message}">Mensagem da Comissão</div>
        <p>Faça o ajuste e reenvie pela sua área até <strong th:text="${dueDate}">20/10/2026</strong>
            (5 dias úteis, Edital item 4.3).</p>
        <p style="text-align:center;margin:28px 0;">
            <a th:replace="~{mail/fragments :: button(${link}, 'Fazer o ajuste')}"></a>
        </p>
    </div>
    <div th:replace="~{mail/fragments :: footer}"></div>
</div>
</body>
</html>
