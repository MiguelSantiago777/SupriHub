<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{mail/fragments :: head}"></head>
<body style="margin:0;background:#f4f4f4;">
<div style="max-width:600px;margin:0 auto;background:#ffffff;">
    <div th:replace="~{mail/fragments :: header}"></div>
    <div style="padding:24px;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.6;color:#1a1a1a;">
        <p>Olá, <strong th:text="${name}">Maria</strong>!</p>
        <p>Recebemos o seu <strong>Requerimento de Credenciamento</strong> no Contrata + NATA.</p>
        <p>Número do protocolo: <strong th:text="${protocol}">CR-2026-00001</strong></p>
        <p>A Comissão de Credenciamento vai analisar os seus dados e documentos até
            <strong th:text="${dueDate}">20/10/2026</strong> (10 dias úteis). Se faltar algo, você recebe um
            pedido de ajuste por e-mail.</p>
        <p style="text-align:center;margin:28px 0;">
            <a th:replace="~{mail/fragments :: button(${link}, 'Acompanhar meu requerimento')}"></a>
        </p>
    </div>
    <div th:replace="~{mail/fragments :: footer}"></div>
</div>
</body>
</html>
