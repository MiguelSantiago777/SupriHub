<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{mail/fragments :: head}"></head>
<body style="margin:0;background:#f4f4f4;">
<div style="max-width:600px;margin:0 auto;background:#ffffff;">
    <div th:replace="~{mail/fragments :: header}"></div>
    <div style="padding:24px;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.6;color:#1a1a1a;">
        <p>Olá, <strong th:text="${name}">Maria</strong>!</p>
        <p>Recebemos um pedido para criar uma nova senha para a sua conta no SupriHub.</p>
        <p style="text-align:center;margin:28px 0;">
            <a th:replace="~{mail/fragments :: button(${link}, 'Criar nova senha')}"></a>
        </p>
        <p style="font-size:15px;">Se o botão não funcionar, copie e cole este endereço no navegador:<br>
            <span th:text="${link}" style="word-break:break-all;">link</span></p>
        <p style="font-size:15px;">O link vale por 2 horas. Se você não pediu, ignore esta mensagem — sua senha continua a mesma.</p>
    </div>
    <div th:replace="~{mail/fragments :: footer}"></div>
</div>
</body>
</html>
