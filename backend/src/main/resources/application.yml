spring:
  application:
    name: suprihub
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/suprihub}
    username: ${DB_USER:suprihub}
    password: ${DB_PASSWORD:suprihub}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: America/Sao_Paulo
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:suprihub}
    password: ${RABBITMQ_PASSWORD:suprihub}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 2s
          multiplier: 3
          max-interval: 30s
  thymeleaf:
    check-template-location: false

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  health:
    mail:
      enabled: false # indisponibilidade do SMTP não deve derrubar a API (e-mail é assíncrono)
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

suprihub:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  timezone: America/Sao_Paulo
  jwt:
    secret: ${JWT_SECRET:}
    issuer: suprihub
    access-ttl: 15m
    refresh-ttl: 7d
    secure-cookie: ${JWT_SECURE_COOKIE:true}
  storage:
    local-path: ${STORAGE_PATH:./data/files}
  messaging:
    relay-enabled: true
    relay-interval: 2s
    relay-batch-size: 50
    max-attempts: 10
    published-retention: 30d
    exchange: suprihub.events
  rate-limit:
    enabled: true
    public-per-minute: 120
    auth-per-minute: 20
  mail:
    from: ${MAIL_FROM:Contrata + NATA <nao-responda@institutonata.org.br>}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    demo-users: false

logging:
  level:
    root: INFO
    org.institutonata.suprihub: INFO
