# Perfil de desenvolvimento: segredos fracos e usuários de demonstração. NUNCA usar em produção.
suprihub:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    secure-cookie: false
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@suprihub.local}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}
    demo-users: ${DEMO_USERS:true}
    demo-password: ${DEMO_PASSWORD:Senha@123}

logging:
  level:
    org.institutonata.suprihub: DEBUG
